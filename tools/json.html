<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JSON Formatter</title>

<style>
:root{
    --primary:#2563eb;
    --success:#16a34a;
    --danger:#dc2626;
    --bg:#f3f6fa;
    --card:#ffffff;
    --border:#e5e7eb;
    --text:#1f2937;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    font-family:Segoe UI,Microsoft JhengHei,sans-serif;
    color:var(--text);
    padding:30px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.card{
    background:var(--card);
    border-radius:16px;
    overflow:hidden;
    box-shadow:
      0 4px 20px rgba(0,0,0,.08),
      0 1px 3px rgba(0,0,0,.1);
}

.header{
    padding:20px 30px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
}

.header h1{
    font-size:24px;
}

.header p{
    opacity:.9;
    margin-top:5px;
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    padding:20px;
    border-bottom:1px solid var(--border);
}

button{
    border:none;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-success{
    background:var(--success);
    color:white;
}

.btn-dark{
    background:#374151;
    color:white;
}

.btn-danger{
    background:var(--danger);
    color:white;
}

.editor-area{
    display:grid;
    grid-template-columns:1fr 1fr;
}

.panel{
    padding:15px;
}

.panel-title{
    font-size:14px;
    font-weight:bold;
    margin-bottom:10px;
    color:#6b7280;
}

textarea{
    width:100%;
    height:550px;
    resize:vertical;

    border:1px solid var(--border);
    border-radius:10px;

    padding:15px;
    font-size:14px;
    line-height:1.6;

    font-family:
      Consolas,
      "Cascadia Code",
      monospace;

    background:#0f172a;
    color:#e2e8f0;
}

.footer{
    padding:15px 20px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
}

.status-success{
    color:#16a34a;
    font-weight:600;
}

.status-error{
    color:#dc2626;
    font-weight:600;
}

.info{
    color:#6b7280;
    font-size:14px;
}

.toast{
    position:fixed;
    top:20px;
    right:20px;

    background:#111827;
    color:white;

    padding:12px 20px;
    border-radius:10px;

    opacity:0;
    transform:translateY(-20px);

    transition:.3s;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

@media(max-width:900px){

    .editor-area{
        grid-template-columns:1fr;
    }

    textarea{
        height:300px;
    }
}

@media (prefers-color-scheme: dark){

    :root{
        --bg:#0f172a;
        --card:#111827;
        --text:#f3f4f6;
        --border:#374151;
    }

    .panel-title{
        color:#d1d5db;
    }

    .info{
        color:#9ca3af;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">
            <h1>JSON Formatter</h1>
            <p>Beautify • Minify • Validate • Copy</p>
        </div>

        <div class="toolbar">

            <button class="btn-primary" onclick="beautify()">
                Beautify
            </button>

            <button class="btn-success" onclick="minify()">
                Minify
            </button>

            <button class="btn-dark" onclick="validateJson()">
                Validate
            </button>

            <button class="btn-dark" onclick="copyResult()">
                Copy
            </button>

            <button class="btn-danger" onclick="clearAll()">
                Clear
            </button>

        </div>

        <div class="editor-area">

            <div class="panel">
                <div class="panel-title">
                    INPUT JSON
                </div>

                <textarea
                    id="inputJson"
                    placeholder="Paste JSON here..."
                ></textarea>
            </div>

            <div class="panel">
                <div class="panel-title">
                    OUTPUT
                </div>

                <textarea
                    id="outputJson"
                    readonly
                ></textarea>
            </div>

        </div>

        <div class="footer">

            <div id="status">
                Ready
            </div>

            <div class="info" id="stats">
                Lines: 0 | Chars: 0
            </div>

        </div>

    </div>

</div>

<div id="toast" class="toast"></div>

<script>

function showToast(msg){

    const toast=document.getElementById("toast");

    toast.innerText=msg;
    toast.classList.add("show");

    setTimeout(()=>{

        toast.classList.remove("show");

    },2000);
}

function setStatus(msg,isError=false){

    const status=document.getElementById("status");

    status.innerHTML=msg;
    status.className=
        isError
            ? "status-error"
            : "status-success";
}

function updateStats(text){

    const lines=text
        ? text.split("\n").length
        : 0;

    const chars=text.length;

    document.getElementById("stats")
        .innerText=
        `Lines: ${lines} | Chars: ${chars}`;
}

function parseJson(){

    const input=
        document.getElementById("inputJson")
        .value
        .trim();

    if(!input){

        setStatus("請輸入 JSON",true);

        return null;
    }

    try{

        return JSON.parse(input);

    }catch(ex){

        setStatus(
            "JSON 錯誤："+ex.message,
            true
        );

        return null;
    }
}

function beautify(){

    const data=parseJson();

    if(!data) return;

    const result=
        JSON.stringify(
            data,
            null,
            4
        );

    outputJson.value=result;

    updateStats(result);

    setStatus("✅ JSON 格式正確");
}

function minify(){

    const data=parseJson();

    if(!data) return;

    const result=
        JSON.stringify(data);

    outputJson.value=result;

    updateStats(result);

    setStatus("✅ Minify 完成");
}

function validateJson(){

    const data=parseJson();

    if(!data) return;

    setStatus("✅ Valid JSON");
    showToast("JSON 驗證成功");
}

async function copyResult(){

    const text=
        outputJson.value;

    if(!text){

        showToast("沒有內容可複製");
        return;
    }

    await navigator
        .clipboard
        .writeText(text);

    showToast("已複製到剪貼簿");
}

function clearAll(){

    inputJson.value="";
    outputJson.value="";

    updateStats("");

    document.getElementById("status")
        .innerText="Ready";

    showToast("已清空");
}

</script>

</body>
</html>
